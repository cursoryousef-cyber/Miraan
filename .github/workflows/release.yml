name: iOS Release & App Store Connect Upload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    name: Build, Archive & Upload to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Automatic iOS Version & Build Number
        run: |
          git fetch --tags origin || true

          BASE_COMMIT="4ea1d79f04ee881a5eacae9d13db1b606f236ff4"
          BASE_MAJOR="1"
          BASE_MINOR="15"

          if git merge-base --is-ancestor "$BASE_COMMIT" HEAD 2>/dev/null; then
            COMMITS_SINCE_BASE=$(git rev-list --count "$BASE_COMMIT"..HEAD)
          else
            COMMITS_SINCE_BASE=0
          fi

          CALCULATED_MINOR=$((BASE_MINOR + COMMITS_SINCE_BASE))
          MARKETING_VERSION="${BASE_MAJOR}.${CALCULATED_MINOR}"

          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            BUILD_NUMBER="$(( 100 + RUN_NUM )).${RUN_ATTEMPT}"
          else
            BUILD_NUMBER="$(( 100 + RUN_NUM ))"
          fi

          perl -pi -e "s/MARKETING_VERSION = .*/MARKETING_VERSION = ${MARKETING_VERSION};/g" Miran.xcodeproj/project.pbxproj
          perl -pi -e "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" Miran.xcodeproj/project.pbxproj

          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV

          echo "================================================="
          echo "Calculated Marketing Version : ${MARKETING_VERSION}"
          echo "Calculated Build Number      : ${BUILD_NUMBER}"
          echo "================================================="

      - name: Audit & Auto-Select Newest Xcode
        run: |
          echo "================ Installed Xcode Apps ================"
          ls -la /Applications | grep Xcode || true

          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST_XCODE" ]; then
            echo "Auto-Selecting Newest Xcode: $NEWEST_XCODE"
            sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          fi

          echo "================ Xcode Version ================"
          xcodebuild -version

          echo "================ Active Developer ================"
          xcode-select -p

          echo "================ iPhoneOS SDK ================"
          xcrun --sdk iphoneos --show-sdk-version

          echo "================ Installed SDKs ================"
          xcodebuild -showsdks

      - name: Verify Required SDK Version (iOS SDK 16+ Check)
        run: |
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "0.0")
          SDK_MAJOR=$(echo "$SDK_VER" | cut -d'.' -f1)

          echo "Detected iOS SDK Version: ${SDK_VER}"

          if [ "$SDK_MAJOR" -lt 16 ]; then
            echo "=========================================================================="
            echo "❌ NOTICE: Xcode iOS 16+ SDK is required for building Miran App."
            echo "   Active SDK Detected: iphoneos${SDK_VER}"
            echo "=========================================================================="
            exit 1
          fi

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "Installed distribution certificate and provisioning profile successfully."
          fi

      - name: Check App Store Connect API Key Secrets
        id: check_secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "App Store Connect API key validated successfully at $KEY_PATH."
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "Notice: App Store Connect API secrets not configured. Building & archiving in local validation mode."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive App (Signed App Store Release)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -archivePath build/Miran.xcarchive \
                     -project Miran.xcodeproj \
                     -scheme Miran \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     MARKETING_VERSION="${MARKETING_VERSION}" \
                     CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
                     TARGETED_DEVICE_FAMILY="1" \
                     SDKROOT=iphoneos \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_FRAMEWORKS=NO \
                     ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Archive App (Unsigned Verification Archive)
        if: steps.check_secrets.outputs.has_secrets != 'true'
        run: |
          mkdir -p build
          xcodebuild -project Miran.xcodeproj \
                     -scheme Miran \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Miran.xcarchive \
                     MARKETING_VERSION="${MARKETING_VERSION}" \
                     CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
                     CODE_SIGNING_ALLOWED=NO \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_FRAMEWORKS=NO \
                     ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
                     archive

      - name: Create ExportOptions.plist
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>B4S7M6N5U5</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA (App Store Release)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild -exportArchive \
                     -archivePath build/Miran.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist build/ExportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
                     -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
                     -authenticationKeyPath "$KEY_PATH"

      - name: Package IPA (Payload Zip Verification Export)
        run: |
          mkdir -p build/Export/Payload
          cp -R build/Miran.xcarchive/Products/Applications/Miran.app build/Export/Payload/
          cd build/Export && zip -q -r Miran.ipa Payload
          echo "IPA generated successfully at build/Export/Miran.ipa"

      - name: Inspect & Verify IPA Version Parity
        run: |
          mkdir -p build/InspectIPA
          unzip -q build/Export/Miran.ipa -d build/InspectIPA

          IPA_INFO_PLIST="build/InspectIPA/Payload/Miran.app/Info.plist"

          if [ ! -f "$IPA_INFO_PLIST" ]; then
            echo "❌ CRITICAL ERROR: Info.plist missing inside exported IPA!"
            exit 1
          fi

          IPA_MARKETING_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$IPA_INFO_PLIST" 2>/dev/null || plutil -extract CFBundleShortVersionString raw "$IPA_INFO_PLIST" 2>/dev/null || true)
          IPA_BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IPA_INFO_PLIST" 2>/dev/null || plutil -extract CFBundleVersion raw "$IPA_INFO_PLIST" 2>/dev/null || true)

          echo "================================================="
          echo "Workflow Target Marketing Version : ${MARKETING_VERSION}"
          echo "Workflow Target Build Number      : ${BUILD_NUMBER}"
          echo "IPA Embedded CFBundleShortVersion : ${IPA_MARKETING_VER}"
          echo "IPA Embedded CFBundleVersion      : ${IPA_BUILD_NUM}"
          echo "================================================="

          if [ "$IPA_MARKETING_VER" != "$MARKETING_VERSION" ]; then
            echo "❌ VERSION PARITY MISMATCH: IPA version ($IPA_MARKETING_VER) does not match expected workflow version ($MARKETING_VERSION)!"
            exit 1
          fi

          if [ "$IPA_BUILD_NUM" != "$BUILD_NUMBER" ]; then
            echo "❌ BUILD NUMBER PARITY MISMATCH: IPA build number ($IPA_BUILD_NUM) does not match expected workflow build number ($BUILD_NUMBER)!"
            exit 1
          fi

          echo "IPA_MARKETING_VER=${IPA_MARKETING_VER}" >> $GITHUB_ENV
          echo "IPA_BUILD_NUM=${IPA_BUILD_NUM}" >> $GITHUB_ENV
          echo "✅ VERSION PARITY VERIFIED SUCCESSFULLY!"

      - name: Generate GitHub Actions Job Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 MIRAN iOS Automatic Release & IPA Verification Report

          | Metric | Value |
          | :--- | :--- |
          | **Source Commit** | \`${GITHUB_SHA}\` |
          | **Marketing Version** | \`${MARKETING_VERSION}\` |
          | **Build Number** | \`${BUILD_NUMBER}\` |
          | **IPA CFBundleShortVersionString** | \`${IPA_MARKETING_VER}\` |
          | **IPA CFBundleVersion** | \`${IPA_BUILD_NUM}\` |
          | **Version Parity Verification** | ✅ PASS |
          EOF

      - name: Upload Miran.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miran-iOS-v${{ env.MARKETING_VERSION }}-build-${{ env.BUILD_NUMBER }}
          path: build/Export/Miran.ipa
          retention-days: 14

      - name: Upload IPA to App Store Connect
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/Export/Miran.ipa -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
